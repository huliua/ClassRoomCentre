spring:
  application:
    name: ClassRoomCentre

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/classroomcentre?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driverClassName: com.mysql.cj.jdbc.Driver
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      validation-query: SELECT 1 FROM DUAL
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat,wall
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        loginUsername: admin
        loginPassword: 123456


  data:
    redis:
      host: localhost
      port: 6379
      database: 8
      lettuce:
        pool:
          max-idle: 16
          max-active: 32
          min-idle: 8
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: rabbitmq
    virtual-host: /
    connection-timeout: 10000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true            # 开启消费者端本地重试
        max-attempts: 3          # 最大重试次数 (包含第1次)
        initial-interval: 1000ms # 第一次重试间隔 1秒
        multiplier: 2            # 间隔倍数 (1s -> 2s -> 4s)
        max-interval: 10000ms
    listener:
      simple:
        concurrency: 10          # 初始线程数 (常驻消费者)
        max-concurrency: 50      # 最大线程数 (当队列积压时自动扩容)
        # 限流配置 (配合上面的并发数)
        prefetch: 50             # 每个消费者线程只预取 50 条
        acknowledge-mode: manual # 手动确认
        retry:
          initial-interval: 1000ms
          max-interval: 10000ms
          max-attempts: 5
          multiplier: 2
          enabled: true


server:
  port: 18080

redisson:
  singleServerConfig:
    address: redis://localhost:6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
#  executor-type: batch

jasypt:
  encryptor:
    password: huliua
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator # 重点，默认的iv生成器会生成一个随机的iv，每次加密的iv都不一样，导致解密失败

test:
  encodePassword: ENC(th+cRBjUHfOCrN1iEt+X9w==)
  plainPassword: 123456
